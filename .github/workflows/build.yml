name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate resource JSON
        run: find src/main/resources example-config server-config-datapack -type f \( -name '*.json' -o -name '*.mcmeta' \) -print0 | xargs -0 -n1 jq -e . > /dev/null

      - name: Build and run unit tests
        run: ./gradlew --no-daemon build

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: homeostatic-heater-${{ github.sha }}
          path: |
            build/libs/homeostatic-heater-*.jar
            !build/libs/*-sources.jar
