name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out sources
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Validate resource JSON
        run: find src/main/resources example-config server-config-datapack -type f \( -name '*.json' -o -name '*.mcmeta' \) -print0 | xargs -0 -n1 jq -e . > /dev/null

      - name: Verify vanilla pickaxe tag path
        run: |
          test -f src/main/resources/data/minecraft/tags/blocks/mineable/pickaxe.json
          jq -e '.values | index("homeostatic_heater:coal_heater") != null' src/main/resources/data/minecraft/tags/blocks/mineable/pickaxe.json

      - name: Build and run unit tests
        run: ./gradlew --no-daemon build

      - name: Upload mod jar
        uses: actions/upload-artifact@v7
        with:
          name: homeostatic-heater-${{ github.sha }}
          path: |
            build/libs/homeostatic-heater-*.jar
            !build/libs/*-sources.jar
