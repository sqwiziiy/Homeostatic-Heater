name: Publish to Modrinth

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional: existing release tag (leave empty to publish current main)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: modrinth-publish-${{ github.event.release.tag_name || inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
      MODRINTH_PROJECT_ID: ${{ vars.MODRINTH_PROJECT_ID }}
      RELEASE_REF: ${{ github.event.release.tag_name || inputs.release_tag || 'main' }}
    steps:
      - name: Check out the published version
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Validate version and prepare release notes
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^mod_version=//p' gradle.properties)"
          test -n "$version" || { echo "::error::Missing mod_version"; exit 1; }
          if [[ "$RELEASE_REF" != "main" && "$RELEASE_REF" != "v$version" ]]; then
            echo "::error::Tag $RELEASE_REF does not match project version v$version"
            exit 1
          fi
          echo "MOD_VERSION=$version" >> "$GITHUB_ENV"
          awk -v heading="## $version" '
            $0 == heading { printing=1; next }
            printing && /^## / { exit }
            printing { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md || {
            echo "::error::No changelog section for $version"; exit 1;
          }

      - name: Build and test release JAR
        run: ./gradlew --no-daemon clean build

      - name: Verify distribution file
        shell: bash
        run: |
          set -euo pipefail
          test -f "build/libs/homeostatic-heater-${MOD_VERSION}.jar"

      - name: Upload JAR to existing GitHub Release
        if: ${{ github.event_name == 'release' || inputs.release_tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$TAG" >/dev/null
          gh release upload "$TAG" "build/libs/homeostatic-heater-${MOD_VERSION}.jar" --clobber

      - name: Note missing Modrinth credentials
        if: ${{ env.MODRINTH_TOKEN == '' || env.MODRINTH_PROJECT_ID == '' }}
        run: echo "::warning::Modrinth upload skipped (set MODRINTH_TOKEN secret and MODRINTH_PROJECT_ID variable)."

      - name: Upload version to Modrinth
        if: ${{ env.MODRINTH_TOKEN != '' && env.MODRINTH_PROJECT_ID != '' }}
        uses: Kira-NT/mc-publish@v3.3.1
        with:
          modrinth-id: ${{ env.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ env.MODRINTH_TOKEN }}
          name: Homeostatic Heater ${{ env.MOD_VERSION }}
          version: ${{ env.MOD_VERSION }}
          version-type: release
          changelog-file: release-notes.md
          files: build/libs/homeostatic-heater-${{ env.MOD_VERSION }}.jar
          loaders: fabric
          game-versions: '1.20.1'
          environment: client | server
          java: '17'
          modrinth-dependencies: |
            oDobngty(required)
            P7dR8mSH(required)
