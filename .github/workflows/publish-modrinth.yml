name: Publish GitHub release to Modrinth

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing GitHub release tag (example: v1.6.0)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
      MODRINTH_PROJECT_ID: ${{ vars.MODRINTH_PROJECT_ID }}
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
    steps:
      - name: Check out exact release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Check release tag matches Gradle version
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^mod_version=//p' gradle.properties)"
          test "$RELEASE_TAG" = "v$version" || { echo "::error::Expected tag v$version but got $RELEASE_TAG"; exit 1; }

      - name: Build and test release
        run: ./gradlew --no-daemon clean build

      - name: Check Modrinth configuration
        if: ${{ env.MODRINTH_TOKEN == '' || env.MODRINTH_PROJECT_ID == '' }}
        run: |
          echo "::warning::Modrinth skipped: add repository secret MODRINTH_TOKEN and repository variable MODRINTH_PROJECT_ID."

      - name: Publish to Modrinth
        if: ${{ env.MODRINTH_TOKEN != '' && env.MODRINTH_PROJECT_ID != '' }}
        uses: Kira-NT/mc-publish@v3.3.1
        with:
          modrinth-id: ${{ env.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ env.MODRINTH_TOKEN }}
          name: "Homeostatic Heater ${{ env.RELEASE_TAG }}"
          version: ${{ env.RELEASE_TAG }}
          version-type: release
          changelog-file: CHANGELOG.md
          files: |
            build/libs/homeostatic-heater-*.jar
            !build/libs/*-sources.jar
          loaders: fabric
          game-versions: '1.20.1'
          java: '17'
          modrinth-dependencies: |
            oDobngty(required)
            P7dR8mSH(required)
